<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Quotes</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #ffffff;

    /* This centers everything vertically and horizontally */
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding-top:120px;
    margin:0;
}

h1{
    font-size:42px;
    margin-bottom:40px;
}

#quote{
    font-size:28px;
    font-style:italic;
    max-width:800px;
    text-align:center;
    line-height:1.6;
    color:#333;
}

</style>

</head>

<body>

<h1>My Favorite Quotes</h1>

<div id="quote"></div>

<script>

const quotes = [
' "The reward of deeds depends upon the intentions, and every person will get the reward according to what he has intended." - Muhammad, Peace be upon him ',    
' "It is not that I am so smart, it is just that I stay with problems longer." – Albert Einstein ',
' "We are what we repeatedly do. Excellence, therefore, is not an act but a habit." – Aristotle / Will Durant ',
' "HQW = TS * IF" - Cal Newport ',
' "If you don’t produce, you won’t thrive – no matter how skilled or talented you are."  – Cal Newport ',
' "The game is afoot." - Sherlock Holmes in  Adventure of the Abbey Grange ',
' "When you have eliminated all which is impossible, then whatever remains, however improbable, must be the truth." - Sherlock Holmes in The Sign of Four ',
' "Education never ends, Watson. It is a series of lessons, with the greatest for the last." - Sherlock Holmes in His Last Bow',
' "I never make exceptions. An exception disproves the rule." – Sherlock Holmes in The Sign of Four',
' "There is nothing more deceptive than an obvious fact." - Sherlock Holmes in The Boscombe Valley Mystery ',
' "I am a brain, Watson. The rest of me is a mere appendix." - Sherlock Holmes in The Adventure of the Mazarin Stone ',
' "There are no extraordinary men...just extraordinary circumstances that ordinary men are forced to deal with." - Admiral William Halsey Jr. ',
' "A ship in port is safe, but that’s not what ships are built for." – Admiral Grace Murray Hopper '
];

const quoteDiv = document.getElementById("quote");

quotes.forEach(function(q){
    const p = document.createElement("p");
    p.textContent = q;
    quoteDiv.appendChild(p);
});

</script>
</body>

</html>
