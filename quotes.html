<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Quotes</title>

<style>

body{
    font-family: Arial, sans-serif;
    background-color: #ffffff;

    /* This centers everything vertically and horizontally */
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    height:100vh;
    margin:0;
}

h1{
    font-size:42px;
    margin-bottom:40px;
}

#quote{
    font-size:28px;
    font-style:italic;
    max-width:800px;
    text-align:center;
    line-height:1.6;
    color:#333;
}

</style>

</head>

<body>

<h1>My Favorite Quotes</h1>

<div id="quote"></div>

<script>

const quotes = [
"It's not that I'm so smart, it's just that I stay with problems longer. – Albert Einstein",
"I never make exceptions. An exception disproves the rule. – Sherlock Holmes",
"We are what we repeatedly do. Excellence, therefore, is not an act but a habit. – Aristotle / Will Durant"
];

const quoteDiv = document.getElementById("quote");

const randomIndex = Math.floor(Math.random() * quotes.length);

quoteDiv.textContent = quotes[randomIndex];

</script>

</body>

</html>
